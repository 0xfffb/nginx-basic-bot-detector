# Minimal example wiring nginx-basic-bot-detector's Lua files into OpenResty (ngx_http_lua_module
# + lua-cjson ship built into the openresty/openresty:alpine image already; lua-resty-openssl does
# not and needs `opm install fffonion/lua-resty-openssl` — see the root CLAUDE.md for exact
# install commands). Not run end-to-end in CI; verify against your actual OpenResty version before
# trusting it in production.

worker_processes auto;
events {
  worker_connections 1024;
}

http {
  # Points this repo's Lua files at wherever lua/ and templates/ are mounted.
  lua_package_path "/etc/bot-detector/lua/?.lua;;";

  # No init_worker_by_lua_block needed — challenge.lua/verify.lua derive the challenge path, read
  # their template files, and read cookie_ttl_secs from lua/config.lua as plain module-load-time
  # code, which runs once per worker automatically the first time gate.lua require()s them (Lua
  # caches a module after its first load). See CLAUDE.md's "Architecture" section.

  server {
    listen 80;
    server_name _;

    # bypass_prefixes is an nginx-level routing decision — which paths this filter even applies
    # to — so it lives here, not in lua/config.lua. (cookie_ttl_secs used to live here too, but
    # now comes from lua/config.lua instead — see CLAUDE.md.)
    set $bypass_prefixes "/static/,/favicon.ico";

    # Internal-only — reached exclusively via gate.lua's `ngx.exec("@upstream")`, never matched
    # directly by a client request. This is the only location allowed to `proxy_pass`; gate.lua
    # itself can't just fall through to a `proxy_pass` configured on `location /`, because it
    # runs in the content phase (needed so it can write a response body for the deny/challenge
    # cases) and content phase has no implicit "if I don't write anything, proxy_pass anyway" —
    # see "Why gate.lua runs in the content phase..." in CLAUDE.md.
    #
    # `@upstream` is just this location's name — it has nothing to do with nginx's `upstream {}`
    # block. proxy_pass here can point anywhere a normal proxy_pass can: a bare host:port (as
    # below), a unix socket, a variable, or a named `upstream { ... }` block if you want
    # load-balancing across multiple servers. Swap in whatever your own setup already proxies to.
    location @upstream {
      internal;
      proxy_pass http://127.0.0.1:8080;
      proxy_set_header Host $host;
    }

    # The single entry point every client request actually hits. gate.lua dispatches everything
    # from here — bypass check, the challenge endpoint (verify.lua), the cookie gate
    # (challenge.lua on failure), or ngx.exec("@upstream") on success. See gate.lua's own header
    # comment for the full decision tree.
    location / {
      content_by_lua_file /etc/bot-detector/lua/gate.lua;
    }
  }
}
